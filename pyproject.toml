[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uklegalbench"
version = "0.1.0"
description = "UK Legal AI Hallucination Audit and AI Judge study"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
all = ["anthropic", "openai"]
dev = ["pytest"]

[project.scripts]
ulb = "ulb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
